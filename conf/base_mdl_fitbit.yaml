#     2: '2 to 4 Per Month'
#     3: '2 to 3 Per Week'
#     4: '4 or More Per Week'
# manually specify subcohort columns because order matters
subcohort_cols: ['subcohort_CVD', 
                  'subcohort_Diabetes', 
                  'subcohort_OSA', 
                  'subcohort_MDD', 
                  'subcohort_Anxiety', 
                  'subcohort_Bipolar', 
                  'subcohort_ADHD']
static_features: ['age', 
                  'sex_male', 
                  'race_nonwhite',
                  'BMI']
survey_features: ['binge_drinking_freq_Daily',
                  'binge_drinking_freq_Weekly',
                  'binge_drinking_freq_Monthly',
                  'binge_drinking_freq_Less Than Monthly',
                  # 'alcohol_drinking_Yes',
                  # 'alcohol_drinking_No',
                  # 'alcohol_drinking_Unknown',
                  # 'binge_drinking_freq_Never In Last Year',
                  'binge_drinking_freq_Unknown',
                  # 'daily_drink_count_0',
                  'daily_drink_count_1 or 2',
                  'daily_drink_count_3 or 4',
                  'daily_drink_count_5 or More',
                  # 'daily_drink_count_5 or 6',
                  # 'daily_drink_count_7 to 9',
                  # 'daily_drink_count_10 or More',
                  'daily_drink_count_Unknown',
                  # 'ever_smoker_Yes',
                  # 'ever_smoker_Unknown', 
                  # 'smoke_freq_Never smoker',
                  'smoke_freq_Former smoker',
                  'smoke_freq_Some Days',
                  'smoke_freq_Every Day',
                  'smoke_freq_Unknown']

time_series_features: [
                        'fat_burn_min', 
                        'cardio_min', 
                        'peak_min',

                        'fairly_active_minutes', 
                        'lightly_active_minutes', 
                        'steps', 
                        'very_active_minutes', 

                        # 'minute_in_bed',
                        # 'minute_asleep', 
                        # 'sleep_efficiency',
                        'minute_after_wakeup', 
                        # 'minute_awake', 
                        # 'deep_perc',
                        # 'rem_perc',
                        # 'wake_perc',s
                        'minute_wake',
                        'minute_light',
                        'minute_deep',
                        'minute_rem',
                        'nap_min',
                        'fat_burn_hr_to_light_active_ratio',
                        # 'cardio_hr_to_fairly_active_ratio',
                        # 'peak_hr_to_very_active_ratio'
                        ]
rmssd_features: [
                  'minute_wake',
                  'minute_light',
                  'minute_deep',
                  'minute_rem'

                  # 'minute_in_bed',
                  # 'deep_perc',
                  # 'rem_perc',
                  # 'light_perc'
                  ]
results_folder: 'results/base_mdl_20260225_seed42/'

excl_vars_ts: ['out_of_range_min', # we alr know this through fat burn minutes
                'sedentary_minutes',
                'calories_out',
                'marginal_calories', # keeping activity calories because marginal calories linked to height and weight and BMI
                'minute_asleep', # not necessary since we have minute light, deep, wake
                'sleep_efficiency', # info encoded in minute_wake
                'cardio_hr_to_fairly_active_ratio', # too many missing values
                'peak_hr_to_very_active_ratio' # too many missing values
             ]
excl_vars_static: ['smoke_start_age', # since na value has been filled with 0, it is hard to interpret this variable in regression
                    'other_smoking' # exclude as less than 1%
                    ]

xgb_run: True
transformer_run: True
transformer_mdl_setting: 
  val_split: 0.15
  test_split: 0.15
  batch_size: 128
  d_model: 64
  n_layers: 1
  n_heads: 1
  d_ff: 256
  max_len: 21
  dropout_p: 0.2
  ts_only_config:
    max_epoch: 30
    initial_lr: 8e-3
    weight_decay: 0.1
    cosine_anneal_lr_scheduler:
      T_0: 5      # first restart after 10 epochs
      T_mult: 2      # each next cycle is 2× longer
      eta_min: 1e-6
  with_static_config:
    freeze_mdl_weights: True
    max_epoch: 50
    initial_lr: 5e-3
    weight_decay: 0.1
    cosine_anneal_lr_scheduler:
      T_0: 5        # first restart after 10 epochs
      T_mult: 2      # each next cycle is 2× longer
      eta_min: 1e-6

