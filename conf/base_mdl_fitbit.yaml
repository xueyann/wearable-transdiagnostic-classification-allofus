cohort: 'data/02_intermediate/study_cohorts_20251222/study_cohort_20251222.csv'
# cohort: 'data/02_intermediate/study_cohorts_20251201/study_cohort_clean_control_20251211.csv'
time_series_feature_df: 'data/02_intermediate/study_cohorts_20251222/fitbit_time_series_features.csv'
time_series_sumstats: 'data/02_intermediate/study_cohorts_20251222/fitbit_time_series_features_sumstats.csv'
survey_df: 'data/02_intermediate/survey_df_20251210.csv'
ordinal_var_mapping:
# reference group 
  binge_drinking_freq:
    # 0: 'never_last_year'
    1: 'monthly_or_less'
    2: 'monthly'
    3: 'weekly'
    4: 'daily'
  past_year_drink_freq:
    # 0: 'Never'
    1: 'Monthly Or Less'
    2: '2 to 4 Per Month'
    3: '2 to 3 Per Week'
    4: '4 or More Per Week'
# manually specify subcohort columns because order matters
subcohort_cols: ['subcohort_CVD', 
                  'subcohort_Diabetes', 
                  'subcohort_OSA', 
                  'subcohort_MDD', 
                  'subcohort_Anxiety', 
                  'subcohort_Bipolar', 
                  'subcohort_ADHD']
static_features: ['age', 
                  'sex_male', 
                  'race_white',
                  'BMI']
survey_features: ['binge_drinking_freq', 
                  'alcohol_drinking', 
                  'past_year_drink_freq',
                  'ever_smoker',
                  'daily_cig_count', 
                  'smoke_years', 
                  'smoke_start_age',
                  'other_smoking', 
                  'missing_flag']
time_series_features: ['fat_burn_min', 
                        'cardio_min', 
                        'peak_min',
                        'out_of_range_min', 
                        'activity_calories', 
                        # 'calories_bmr', 
                        'calories_out',
                        # 'elevation', 
                        'fairly_active_minutes', 
                        # 'floors',
                        'lightly_active_minutes', 
                        'marginal_calories', 
                        'sedentary_minutes',
                        'steps', 
                        'very_active_minutes', 
                        'minute_in_bed',
                        'minute_asleep', 
                        'sleep_efficiency',
                        'minute_after_wakeup', 
                        # 'minute_awake', 
                        'minute_deep',
                        'minute_light', 
                        'minute_rem', 
                        'minute_wake', 
                        'nap_min']
results_folder: 'results/transformer_mdl_fitbit_summary_20260105/'

excl_vars_ts: ['out_of_range_min', # we alr know this through fat burn minutes
                'sedentary_minutes',
                'calories_out',
                'marginal_calories', # keeping activity calories because marginal calories linked to height and weight and BMI
                'minute_asleep', # not necessary since we have minute light, deep, wake
                'sleep_efficiency', # info encoded in minute_wake
                'minute_in_bed'
             ]
excl_vars_static: ['smoke_start_age', # since na value has been filled with 0, it is hard to interpret this variable in regression
                    'other_smoking' # exclude as less than 1%
                    ]

xgb_run: True
transformer_run: False
transformer_mdl_setting: 
  val_split: 0.15
  test_split: 0.15
  batch_size: 128
  d_model: 64
  n_layers: 2
  n_heads: 2
  d_ff: 256
  max_len: 21
  dropout_p: 0.2
  ts_only_config:
    max_epoch: 15
    initial_lr: 5e-3
    weight_decay: 0.1
    cosine_anneal_lr_scheduler:
      T_0: 5      # first restart after 10 epochs
      T_mult: 2      # each next cycle is 2× longer
      eta_min: 1e-6
  with_static_config:
    freeze_mdl_weights: True
    max_epoch: 50
    initial_lr: 5e-3
    weight_decay: 0.1
    cosine_anneal_lr_scheduler:
      T_0: 5        # first restart after 10 epochs
      T_mult: 2      # each next cycle is 2× longer
      eta_min: 1e-6

