osa_cohort:
  run: True
  person_df: 'data/01_raw/person_genomics_df_20250513.csv'
  condition_df: 'data/02_intermediate/condition_df_20250506_{i}.csv'
  drug_list: 'conf/drug_list.yaml'
  prescription_path: 'data/01_raw/drug_df_20250610_{i}.csv'
  sleep_drugs_save_path: 'data/02_intermediate/sleep_drug_df_20250611.csv'
  sleep_affecting_drug_classes: ['hypnotics_and_sedatives',
                                'ssri',
                                'snri',
                                'atypical_antipsychotics',
                                'typical_antipsychotics',
                                'stimulants',
                                'anticonvulsants',
                                'anxiolytics']
  subcohorts: {'Obstructive sleep apnea': 'OSA'}
  sleep_conditions_list: ['Sleep apnea',
                      'Insomnia',
                      'Central/nonobstroctive sleep apnea',
                      'Sleep related movement disorders', 
                      'Sleep disorders',
                      'Organic or persistent insomnia', 
                      'Obstructive sleep apnea',
                      'Circadian rhythm sleep disorder',
                      'Cataplexy and narcolepsy']
  exclusion_conditions: { # exclusion based on either group of condition or condition description
    'group': ['mental disorders'],
    'description': [ # sleep conditions
                    'Sleep apnea',
                    'Insomnia',
                    'Central/nonobstroctive sleep apnea',
                    'Sleep related movement disorders', 
                    'Sleep disorders',
                    'Organic or persistent insomnia', 
                    'Obstructive sleep apnea',
                    'Circadian rhythm sleep disorder',
                    'Cataplexy and narcolepsy',
                    # severe cvd conditions
                    'Coronary atherosclerosis',
                    'Congestive heart failure (CHF) NOS',
                    'Pulmonary embolism and infarction, acute',
                    'Cerebral artery occlusion, with cerebral infarction',
                    'Heart failure with preserved EF [Diastolic heart failure]',
                    'Myocardial infarction',
                    'Occlusion and stenosis of precerebral arteries',
                    'Atherosclerosis of aorta',
                    'Heart failure with reduced EF [Systolic or combined heart failure]',
                    'Cerebral aneurysm',
                    'Cerebral ischemia',
                    'Heart failure NOS',
                    'Atherosclerosis',
                    'Acute, but ill-defined cerebrovascular disease',
                    'Other acute and subacute forms of ischemic heart disease',
                    'Aneurysm and dissection of heart',
                    'Occlusion of cerebral arteries',
                    'Occlusion of cerebral arteries, with cerebral infarction',
                    'Atrioventricular block, complete',
                    'Cerebral atherosclerosis',
                    'Heart transplant/surgery'
                    ]
  }
  cohort_save_path: 'data/02_intermediate/study_cohorts/osa_cohort_20250626.csv'

